    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(245, 158, 11, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(16, 185, 129, 0.16),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #fffdf7 0%,
          #f8fafc 50%,
          #f0fdf4 100%
        );

      color: #172033;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Decorative Background */
    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        radial-gradient(
          rgba(16, 185, 129, 0.13) 1px,
          transparent 1px
        );

      background-size: 28px 28px;

      opacity: 0.45;
    }

    .circle {
      position: fixed;

      border-radius: 50%;

      pointer-events: none;
    }

    .circle-one {
      width: 320px;
      height: 320px;

      top: -160px;
      left: -130px;

      border:
        1px solid
        rgba(245, 158, 11, 0.20);
    }

    .circle-two {
      width: 380px;
      height: 380px;

      right: -190px;
      bottom: -190px;

      border:
        1px solid
        rgba(16, 185, 129, 0.20);
    }

    /* Main Card */
    .thank-you-card {
      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 700px;

      padding: 55px 45px;

      text-align: center;

      background:
        rgba(255, 255, 255, 0.90);

      border:
        1px solid
        rgba(16, 185, 129, 0.13);

      border-radius: 26px;

      box-shadow:
        0 25px 70px
        rgba(15, 23, 42, 0.10),

        0 5px 20px
        rgba(16, 185, 129, 0.06);

      backdrop-filter: blur(15px);

      -webkit-backdrop-filter: blur(15px);
    }

    /* Top Accent */
    .accent {
      width: 65px;
      height: 4px;

      margin:
        0 auto 28px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #f59e0b,
          #10b981
        );
    }

    /* Success Icon */
    .success-icon {
      width: 72px;
      height: 72px;

      margin:
        0 auto 24px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #10b981,
          #059669
        );

      box-shadow:
        0 10px 30px
        rgba(16, 185, 129, 0.25),

        0 0 0 8px
        rgba(16, 185, 129, 0.07);
    }

    .success-icon svg {
      width: 36px;
      height: 36px;

      fill: none;

      stroke: white;

      stroke-width: 3;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Heading */
    h1 {
      font-size:
        clamp(
          34px,
          5vw,
          52px
        );

      line-height: 1.18;

      font-weight: 800;

      letter-spacing: -1px;

      color: #172033;

      margin-bottom: 20px;
    }

    h1 span {
      color: #059669;
    }

    /* Intro */
    .intro {
      font-size: 19px;

      line-height: 1.8;

      color: #566274;

      margin-bottom: 28px;
    }

    .intro strong {
      color: #172033;

      font-weight: 700;
    }

    /* Brand Positioning */
    .positioning {
      margin-bottom: 28px;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 0.5px;

      text-transform: uppercase;

      color: #059669;
    }

    /* WhatsApp Community */
    .community {
      padding: 26px 20px;

      margin-bottom: 25px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.07),
          rgba(245, 158, 11, 0.06)
        );

      border:
        1px solid
        rgba(16, 185, 129, 0.13);
    }

    .community h2 {
      font-size: 23px;

      line-height: 1.4;

      color: #172033;

      margin-bottom: 10px;
    }

    .community p {
      font-size: 16px;

      line-height: 1.7;

      color: #667085;

      max-width: 520px;

      margin:
        0 auto 20px;
    }

    .highlight {
      color: #059669;

      font-weight: 700;
    }

    /* WhatsApp Button */
    .whatsapp-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 15px 28px;

      border-radius: 10px;

      background: #25D366;

      color: #ffffff;

      text-decoration: none;

      font-size: 16px;

      font-weight: 700;

      box-shadow:
        0 10px 25px
        rgba(37, 211, 102, 0.22);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .whatsapp-btn:hover {
      transform:
        translateY(-3px);

      box-shadow:
        0 15px 32px
        rgba(37, 211, 102, 0.32);

    .whatsapp-btn svg {
      width: 22px;
      height: 22px;

      fill: currentColor;
    }

    /* Closing Message */
    .closing {
      font-size: 16px;

      line-height: 1.7;

      font-weight: 600;

      color: #667085;
    }

    .closing span {
      color: #059669;
    }

    /* Footer */
    .footer {

      line-height: 1.6;

      }

      .success-icon svg {
        width: 31px;

      }

        font-size:
          clamp(
            32px,
            9vw,
            42px
          );

        letter-spacing: -0.5px;
      }

      .intro {
        font-size: 17px;
      }

      .positioning {
        font-size: 12px;
      }

      .community h2 {
        font-size: 20px;
      }

      .community p {
        font-size: 15px;
      }

      .whatsapp-btn {
        width: 100%;

        max-width: 320px;
      }

      .closing {
        font-size: 15px;
      }

      .circle-one {
        width: 220px;
        height: 220px;

        top: -110px;
        left: -100px;
      }

      .circle-two {
        width: 260px;
        height: 260px;

        right: -130px;
        bottom: -130px;
      }
    }
